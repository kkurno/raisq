name: playwright
slot: checks
description: Runs the Playwright tests against the site, and proves new ones. Needs a site provider.
priority: 30
tool:
  find: npx playwright --version
  install_hint: npm i -D @playwright/test
run: npx playwright test --reporter=line
run_one: npx playwright test --reporter=line {file}
needs: [site]
locks: ["playwright.config.*"]
tests: ["e2e/**", "tests/**/*.spec.*", "**/*.e2e.*"]
