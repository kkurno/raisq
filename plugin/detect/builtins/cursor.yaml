name: cursor
slot: builder
description: Cursor as the builder.
vendor: cursor
model: auto
tool:
  find: cursor-agent --version
  install_hint: curl https://cursor.com/install -fsS | bash
# Runs inside the container, unattended, as an unprivileged user.
run: cursor-agent -p --force --trust --model auto --output-format text "$(cat {prompt})"
install: curl -fsS https://cursor.com/install | bash
# Your existing login, read from the macOS Keychain and passed in for one
# attempt as the token Cursor's CLI reads. The refresh token stays here.
login:
  - env: CURSOR_AUTH_TOKEN
    command: security find-generic-password -s "cursor-access-token" -w
login_env: [CURSOR_API_KEY]
# {node} is the Node version the project asks for (.nvmrc, engines), else 22.
image: node:{node}-bookworm
