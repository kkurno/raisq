name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same branch or PR replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: "1.23"}
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # arch_test.go fails the build on any import pointing outwards.
      - run: go test ./...
      - run: RAISQ_DOCKER_TEST=1 go test ./plugin/docker ./plugin/registry
      # Release binaries are built by release.yml; this only checks every
      # platform still compiles.
      - run: |
          for os in linux darwin; do for arch in amd64 arm64; do
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/raisq
          done; done
      # The installer people run: it must install the latest release where a
      # fresh shell finds it.
      - run: |
          sh -n install.sh
          mkdir -p "$HOME/.local/bin"
          PATH="$HOME/.local/bin:$PATH" sh install.sh
          PATH="$HOME/.local/bin:$PATH" raisq version
