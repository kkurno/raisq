# Example: run `raisq batch` on a schedule in a project that uses RaisQ.
# Copy to .github/workflows/ in that project. A CI runner is a machine that's
# disposable anyway, which is what `isolation: none` is for (5.4); Docker
# works here too and is the safer choice.
name: raisq batch
on:
  schedule: [{cron: "0 1 * * *"}]
  workflow_dispatch:
permissions:
  contents: write        # to push the task branches; RaisQ never merges
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: curl -fsSL https://github.com/<owner>/raisq/releases/latest/download/raisq-linux-amd64 -o /usr/local/bin/raisq && chmod +x /usr/local/bin/raisq
      - run: npm i -g @anthropic-ai/claude-code
      - run: git config user.name raisq && git config user.email raisq@localhost
      - run: raisq batch --for 7h
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - run: git push origin 'refs/heads/raisq/*:refs/heads/raisq/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: batch-report, path: .raisq/batch-report.md}
