name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # arch_test.go fails the build on any import pointing outwards (6.3).
      - run: go test ./...
      - run: RAISQ_DOCKER_TEST=1 go test ./plugin/docker
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - run: GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o raisq-${{ matrix.os }}-${{ matrix.arch }} ./cmd/raisq
      - uses: actions/upload-artifact@v4
        with:
          name: raisq-${{ matrix.os }}-${{ matrix.arch }}
          path: raisq-${{ matrix.os }}-${{ matrix.arch }}
